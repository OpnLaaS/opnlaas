<div class="flex flex-col items-center justify-center w-full px-4 sm:px-6 pb-16 overflow-hidden mt-5">
    <!-- Image -->
    <div class="w-32 sm:w-40 h-auto overflow-hidden m-5 py-4">
        <img id="logo-image" alt="OpnLaaS Logo" class="object-contain w-full h-full logo-image">
    </div>

    <!-- Login Card -->
    <div class="flex items-center justify-center h-fit w-full">
        <div class="w-full max-w-md bg-background-secondary p-6 rounded-lg shadow-lg border border-background-muted">
            <div class="flex flex-col items-center">
                <h2 class="text-center">Log in</h2>
                <p class="mb-4 text-center leading-2">Access your dashboard</p>
            </div>


            <form id="login-form" method="post" action="/api/auth/login" autocomplete="on" class="space-y-5 flex flex-col items-center">
                {{if .LoginError}}
                <div class="w-100 bg-red-200 text-red-700 p-3 rounded-md border border-red-300 mb-4">
                    {{.LoginError}}
                </div>
                {{end}}
                <div class="text-input">
                    <label for="login-username">Username</label>
                    <input id="login-username" type="text" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                </div>
                <div class="text-input">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" autocomplete="current-password" required>
                </div>

                <div class="text-input">
                    <button type="submit"
                        class="w-full bg-accent-primary text-white py-2.5 rounded-lg font-medium hover:bg-accent-secondary cursor-pointer transition">
                        Sign In
                    </button>
                </div>
            </form>

            <p class="mt-4 text-sm text-font-muted text-center">
                Having trouble? Contact an admin.
            </p>
        </div>
    </div>
</div>

<script>
    (() => {
        const usernameInput = document.getElementById("login-username");
        const passwordInput = document.getElementById("login-password");
        if (!usernameInput || !passwordInput) return;
        if (!window.isSecureContext || !("credentials" in navigator)) return;

        let inFlight = false;
        const tryAutofillHint = async () => {
            if (inFlight) return;
            if ((usernameInput.value || "").trim() && (passwordInput.value || "").trim()) return;

            inFlight = true;
            try {
                const credential = await navigator.credentials.get({
                    password: true,
                    mediation: "optional",
                });
                if (!credential) return;

                if (!usernameInput.value && credential.id) {
                    usernameInput.value = credential.id;
                }
                if (!passwordInput.value && credential.password) {
                    passwordInput.value = credential.password;
                }
            } catch (_) {
                // Ignore unsupported environments and user-cancelled requests.
            } finally {
                inFlight = false;
            }
        };

        usernameInput.addEventListener("focus", tryAutofillHint);
        passwordInput.addEventListener("focus", tryAutofillHint);
    })();
</script>
